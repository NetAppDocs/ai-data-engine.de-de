---
indexpage:
  title: AI Data Engine Dokumentation
  summary: Die Dokumentation zu AI Data Engine behandelt das Deployment, das Verbinden
    von Datenquellen und die Nutzung von AI Data Engine für Storage-Optimierung, Metadatenuntersuchung,
    Daten-Governance und kontrollierten KI-Zugriff über MCP.
  keywords: ai data engine, aide, storage optimization, investigation, policies, data
    governance, NetApp Console, governed ai access, mcp, model context protocol
  lead: AI Data Engine ist ein Metadaten-Intelligence-Service, der über NetApp Console
    verwaltet wird, Ihre verbundenen Systeme scannt, einen Metadatenkatalog erstellt
    und Ihnen die Transparenz und Werkzeuge bietet, um Storage zu optimieren und Daten
    im großen Maßstab zu verwalten. Mit Governance für den AI-Zugriff können AI-Clients
    diese Metadaten über das Model Context Protocol (MCP) durchsuchen.
